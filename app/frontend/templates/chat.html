<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="messenger-page">
<div class="app-shell">
    <aside class="sidebar">
        <header class="sidebar-header">
            <div>
                <p class="sidebar-kicker">TeleMAX</p>
                <h1>Чаты</h1>
            </div>
            <div class="header-actions">
                <button class="icon-button" type="button" title="Профиль" aria-label="Профиль" onclick="openProfileModal()">
                    <i class="fas fa-user"></i>
                </button>
                <button class="icon-button danger" type="button" title="Выйти" aria-label="Выйти" onclick="logout()">
                    <i class="fas fa-arrow-right-from-bracket"></i>
                </button>
            </div>
        </header>

        <button class="search-entry" type="button" onclick="openSearchModal()">
            <i class="fas fa-magnifying-glass"></i>
            <span>Найти людей</span>
        </button>

        <div id="dialogs" class="dialogs-list"></div>
    </aside>

    <main class="chat-panel">
        <section id="empty-chat" class="empty-chat">
            <div class="empty-chat-mark"><i class="fas fa-comments"></i></div>
            <p>Выберите диалог</p>
        </section>

        <header id="chat-header" class="chat-header hidden-panel">
            <button class="icon-button mobile-back" type="button" title="Назад" aria-label="Назад" onclick="closeMobileChat()">
                <i class="fas fa-chevron-left"></i>
            </button>
            <div id="chat-avatar" class="avatar avatar-lg profile-clickable" role="button" tabindex="0" onclick="viewUserProfile(currentChat)" onkeydown="handleProfileKey(event, currentChat)"></div>
            <div class="chat-title-block profile-clickable" role="button" tabindex="0" onclick="viewUserProfile(currentChat)" onkeydown="handleProfileKey(event, currentChat)">
                <h2 id="chat-title"></h2>
                <p id="chat-username" class="chat-username"></p>
                <p id="chat-status" class="chat-status"></p>
            </div>
        </header>

        <div id="messages" class="messages-list"></div>

        <footer id="input-area" class="composer hidden-panel">
            <div id="attachment-preview" class="attachment-preview hidden-panel"></div>
            <div class="composer-row">
                <input id="file-input" type="file" multiple onchange="handleFilesSelected(event)" hidden>
                <button class="icon-button attach-button" type="button" title="Прикрепить" aria-label="Прикрепить" onclick="document.getElementById('file-input').click()">
                    <i class="fas fa-paperclip"></i>
                </button>
                <textarea id="message-input" rows="1" placeholder="Сообщение" onkeydown="handleEnter(event)" oninput="handleTyping(); autoResizeMessageInput()"></textarea>
                <button class="icon-button send-button" type="button" title="Отправить" aria-label="Отправить" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </footer>
    </main>
</div>

<div id="user-profile-modal" class="modal hidden-panel" onclick="closeModalOnBackdrop(event, 'user-profile-modal')">
    <section class="modal-card public-profile-card">
        <header class="modal-header">
            <h2>Профиль</h2>
            <button class="icon-button" type="button" title="Закрыть" aria-label="Закрыть" onclick="closeUserProfileModal()">
                <i class="fas fa-xmark"></i>
            </button>
        </header>
        <div id="user-profile-content" class="public-profile-content"></div>
    </section>
</div>

<div id="search-modal" class="modal hidden-panel" onclick="closeModalOnBackdrop(event, 'search-modal')">
    <section class="modal-card search-modal-card">
        <header class="modal-header">
            <h2>Поиск людей</h2>
            <button class="icon-button" type="button" title="Закрыть" aria-label="Закрыть" onclick="closeSearchModal()">
                <i class="fas fa-xmark"></i>
            </button>
        </header>
        <div class="search-modal-input">
            <i class="fas fa-magnifying-glass"></i>
            <input id="person-search" type="text" placeholder="Имя или @аккаунт" oninput="searchUsers()">
        </div>
        <div id="users" class="search-results"></div>
    </section>
</div>

<div id="profile-modal" class="modal hidden-panel" onclick="closeModalOnBackdrop(event, 'profile-modal')">
    <section class="modal-card profile-modal-card">
        <header class="modal-header">
            <h2>Профиль</h2>
            <button class="icon-button" type="button" title="Закрыть" aria-label="Закрыть" onclick="closeProfileModal()">
                <i class="fas fa-xmark"></i>
            </button>
        </header>

        <form id="profile-form" class="profile-form" onsubmit="saveProfile(event)">
            <div class="profile-avatar-row">
                <div id="profile-avatar-preview" class="avatar avatar-xl"></div>
                <label class="avatar-upload">
                    <input id="profile-avatar-input" name="avatar" type="file" accept="image/*" onchange="previewProfileAvatar(event)" hidden>
                    <i class="fas fa-camera"></i>
                    <span>Аватар</span>
                </label>
            </div>

            <div class="form-grid">
                <label>
                    <span>Имя</span>
                    <input id="profile-first-name" name="first_name" autocomplete="given-name">
                </label>
                <label>
                    <span>Фамилия</span>
                    <input id="profile-last-name" name="last_name" autocomplete="family-name">
                </label>
            </div>

            <label>
                <span>Аккаунт</span>
                <div class="username-field">
                    <span>@</span>
                    <input id="profile-username" name="username" autocomplete="username" placeholder="username">
                </div>
            </label>

            <label>
                <span>Дата рождения</span>
                <input id="profile-birth-date" name="birth_date" type="date">
            </label>

            <label>
                <span>О себе</span>
                <textarea id="profile-bio" name="bio" rows="4"></textarea>
            </label>

            <p id="profile-message" class="form-message"></p>

            <button class="primary-action" type="submit">
                <span>Сохранить</span>
                <i class="fas fa-check"></i>
            </button>
        </form>
    </section>
</div>

<script src="/static/js/chat.js"></script>
</body>
</html>
