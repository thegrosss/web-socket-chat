<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Messenger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans h-screen overflow-hidden">

<div class="flex h-full w-full max-w-7xl mx-auto shadow-2xl bg-white relative">

    <!-- Сайдбар (Слева) -->
    <div class="w-1/3 min-w-[320px] max-w-[400px] border-r border-gray-200 flex flex-col bg-white">
        <!-- Шапка сайдбара -->
        <div class="h-16 bg-gray-50 flex items-center justify-between px-4 border-b border-gray-200">
            <h1 class="text-xl font-bold text-gray-800">Чаты</h1>
            <button onclick="logout()" class="text-gray-500 hover:text-red-500 transition"><i class="fas fa-sign-out-alt text-lg"></i></button>
        </div>

        <!-- Поиск -->
        <div class="p-3 border-b border-gray-100 relative">
            <input id="search" onkeyup="searchUsers()" type="text" placeholder="Поиск пользователей..."
                   class="w-full bg-gray-100 text-gray-700 rounded-full py-2 pl-4 pr-10 outline-none focus:ring-2 focus:ring-blue-400">
            <i class="fas fa-search absolute right-6 top-5 text-gray-400"></i>
        </div>

        <!-- Результаты поиска (выпадающее окно) -->
        <div id="users" class="hidden absolute top-[120px] left-0 w-[320px] max-h-60 overflow-y-auto bg-white shadow-xl z-10 border border-gray-100 rounded-b-lg"></div>

        <!-- Список диалогов -->
        <div id="dialogs" class="flex-1 overflow-y-auto bg-white">
            <!-- Диалоги будут добавляться сюда JS-кодом -->
        </div>
    </div>

    <!-- Основной чат (Справа) -->
    <div class="flex-1 flex flex-col bg-[#efeae2] relative">
        <!-- Заглушка, когда чат не выбран -->
        <div id="empty-chat" class="absolute inset-0 flex items-center justify-center bg-[#f0f2f5] z-10">
            <div class="bg-white px-6 py-2 rounded-full shadow-sm text-gray-500">Выберите диалог для начала общения</div>
        </div>

        <!-- Шапка открытого чата -->
        <div id="chat-header" class="h-16 bg-gray-50 border-b border-gray-200 flex items-center px-6 invisible">
            <div id="chat-avatar" class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center text-white font-bold text-lg mr-4 shadow-inner"></div>
            <div class="flex flex-col">
                <div id="chat-title" class="font-semibold text-gray-800 text-lg leading-tight"></div>
                <div id="chat-status" class="text-sm font-medium transition-colors"></div>
            </div>
        </div>


        <!-- Сообщения -->
        <div id="messages" class="flex-1 overflow-y-auto p-6 flex flex-col gap-3"></div>

        <!-- Поле ввода -->
        <div id="input-area" class="h-20 bg-gray-50 border-t border-gray-200 flex items-center px-4 invisible">
            <input id="message-input" onkeypress="handleEnter(event)" oninput="handleTyping()" type="text" placeholder="Написать сообщение..." class="flex-1 bg-white border border-gray-300 rounded-full py-3 px-5 outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-400">

            <button onclick="sendMessage()" class="ml-3 w-12 h-12 bg-blue-500 hover:bg-blue-600 rounded-full text-white flex items-center justify-center transition shadow-md">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>

    </div>
</div>

<script src="/static/js/chat.js"></script>
</body>
</html>
