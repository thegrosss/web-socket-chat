<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат - Вход</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">💬 Чат-комната</h1>
            <p class="text-gray-500">Присоединяйтесь к общению</p>
        </div>

        <form action="/join_chat" method="POST" class="space-y-6">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
                    Ваше имя
                </label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    placeholder="Введите имя"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all"
                >
            </div>

            <div>
                <label for="room_id" class="block text-sm font-medium text-gray-700 mb-2">
                    ID комнаты
                </label>
                <input
                    type="number"
                    id="room_id"
                    name="room_id"
                    required
                    placeholder="Введите номер комнаты"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all"
                >
            </div>

            <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors duration-200 transform hover:scale-105"
            >
                Войти в чат
            </button>
        </form>
    </div>
</body>
</html>
