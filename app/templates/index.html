<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Чат - Комната {{ room_id }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Фикс для мобильных устройств */
        input, button {
            font-size: 16px !important; /* Чтобы не было зума на iOS */
        }
        #messagesContainer {
            -webkit-overflow-scrolling: touch;
            overflow-y: auto;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen p-2 sm:p-4">
    <div class="max-w-4xl mx-auto">
        <!-- Шапка чата -->
        <div class="bg-white rounded-xl sm:rounded-2xl shadow-lg sm:shadow-xl p-3 sm:p-6 mb-3 sm:mb-6">
            <div class="flex justify-between items-center flex-wrap gap-2">
                <div>
                    <h1 class="text-lg sm:text-2xl font-bold text-gray-800">Комната #{{ room_id }}</h1>
                    <p class="text-xs sm:text-sm text-gray-500 mt-1">
                        <span class="inline-block w-2 h-2 bg-green-500 rounded-full mr-1 sm:mr-2"></span>
                        <span id="currentUsername" class="font-semibold">{{ username }}</span>
                    </p>
                </div>
                <div class="flex items-center space-x-2">
                    <span id="connectionStatus" class="px-2 py-1 text-xs sm:px-3 sm:py-1 sm:text-sm bg-green-100 text-green-800 rounded-full font-medium">Подключено</span>
                    <button onclick="location.href='/'"
                        class="px-3 py-1.5 sm:px-4 sm:py-2 text-sm bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg transition-colors">
                        Выйти
                    </button>
                </div>
            </div>
        </div>

        <!-- Сообщения -->
        <div class="bg-white rounded-xl sm:rounded-2xl shadow-lg sm:shadow-xl p-3 sm:p-6">
            <div id="messagesContainer" class="space-y-3 sm:space-y-4 h-[50vh] sm:h-96 overflow-y-auto mb-3 sm:mb-4 p-3 sm:p-4 bg-gray-50 rounded-lg">
                <div class="flex justify-center">
                    <p class="text-gray-400 text-xs sm:text-sm">Загрузка сообщений...</p>
                </div>
            </div>

            <!-- Форма отправки -->
            <form id="messageForm" class="flex gap-2">
                <input
                    type="text"
                    id="messageInput"
                    placeholder="Сообщение..."
                    autocomplete="off"
                    inputmode="text"
                    class="flex-1 px-3 py-2.5 sm:px-4 sm:py-3 text-sm sm:text-base border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all"
                >
                <button
                    type="submit"
                    class="px-4 py-2.5 sm:px-6 sm:py-3 bg-blue-600 hover:bg-blue-700 text-white text-sm sm:text-base font-semibold rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed whitespace-nowrap"
                    id="sendButton"
                >
                    Отпр.
                </button>
            </form>
        </div>
    </div>
    <script>
        window.CHAT_CONFIG = {
            roomId: {{ room_id }},
            username: "{{ username }}",
            userId: {{ user_id }}
        };
    </script>
    <script src="/static/index.js"></script>
</body>
</html>
